name: Refresh FINN data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1-5" # 18:45 IST on weekdays

concurrency:
  group: refresh-public-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python pipeline/build_digest.py --days 7
      - run: python pipeline/cache_research.py
      - run: python pipeline/cache_claims.py
      - name: Commit refreshed public snapshots
        run: |
          git config user.name "finn-data-bot"
          git config user.email "finn-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No refreshed snapshots to publish."
            exit 0
          fi
          git commit -m "Refresh public market snapshot"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another update; retrying."
          done
          echo "Unable to publish refreshed snapshots after 3 attempts." >&2
          exit 1

